<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Wheel Casino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #111, #333);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        #wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid white;
            background: radial-gradient(circle, #333 58%, transparent 58%);
        }
        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 50%;
            left: 50%;
            transform-origin: 0% 0%;
            overflow: hidden;
        }
        .segment span {
            position: absolute;
            top: -40px;
            left: 40%;
            font-size: 14px;
            transform: rotate(90deg);
            transform-origin: 0 100%;
            color: white;
        }
        #pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid white;
        }
        #roll-button {
            margin-top: 40px; /* Drop the button lower */
            padding: 10px 20px;
            font-size: 18px;
            background: #FFD700;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
        .loading {
            font-size: 18px;
            margin-top: 10px;
        }
        .loading span {
            animation: blink 1s infinite;
        }
        .loading span:nth-child(1) {
            animation-delay: 0s;
        }
        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="wheel-container">
        <div id="wheel"></div>
        <div id="pointer"></div>
    </div>
    <button id="roll-button">Tap to Roll</button>
    <div id="result"></div>
    <div class="loading" id="loading" style="display: none;">
        Loading<span>.</span><span>.</span><span>.</span>
    </div>
    <script src="wheel.js"></script>
</body>
</html>
