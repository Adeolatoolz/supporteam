<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lottery Spin Wheel</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1b1f3a, #3a5072);
            color: #fff;
            text-align: center;
            overflow: hidden;
            height: 100vh;
        }
        h1 {
            margin-top: 10px;
            color: #ffc107;
            font-size: 1.5rem;
        }
        /* Wheel Container */
        .wheel-container {
            position: relative;
            margin: 50px auto;
            width: 90%;
            max-width: 500px;
            height: 90%;
            max-height: 500px;
            perspective: 1000px;
        }
        /* The Wheel */
        .wheel {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #f9f9f9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        /* Wheel Segments */
        .wheel .segment {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center -250px;
            width: 100%;
            text-align: center;
            transform: rotate(calc(22.5deg * var(--i))) translateX(-50%);
        }
        .wheel .segment span {
            display: block;
            color: #000;
            font-weight: bold;
            font-size: 0.9rem;
            transform: rotate(calc(-22.5deg * var(--i)));
        }
        /* Pointer */
        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #ffc107;
            transform: translate(-50%, -170%);
            z-index: 100;
        }
        /* Button */
        button {
            background: #ffc107;
            color: #000;
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background: #ff9800;
        }
        /* Result Display */
        .result {
            margin-top: 20px;
            font-size: 1rem;
        }
        /* Mobile Styles */
        @media (max-width: 600px) {
            .wheel-container {
                margin: 20px auto;
                width: 300px;
                height: 300px;
            }
            .pointer {
                transform: translate(-50%, -150%);
            }
            .wheel .segment span {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <h1>AI Lottery Spin Wheel</h1>
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <!-- Adding segments -->
            <div class="segment" style="--i:0"><span>$50,000.00</span></div>
            <div class="segment" style="--i:1"><span>$100,000.00</span></div>
            <div class="segment" style="--i:2"><span>$125,000.00</span></div>
            <div class="segment" style="--i:3"><span>$150,000.00</span></div>
            <div class="segment" style="--i:4"><span>$175,000.00</span></div>
            <div class="segment" style="--i:5"><span>$200,000.00</span></div>
            <div class="segment" style="--i:6"><span>$250,000.00</span></div>
            <div class="segment" style="--i:7"><span>$300,000.00</span></div>
            <div class="segment" style="--i:8"><span>$450,000.00</span></div>
            <div class="segment" style="--i:9"><span>$500,000.00</span></div>
            <div class="segment" style="--i:10"><span>$600,000.00</span></div>
            <div class="segment" style="--i:11"><span>$800,000.00</span></div>
            <div class="segment" style="--i:12"><span>$850,000.00</span></div>
            <div class="segment" style="--i:13"><span>$900,000.00</span></div>
            <div class="segment" style="--i:14"><span>$1,000,000.00</span></div>
            <div class="segment" style="--i:15"><span>$ Empty</span></div>
        </div>
    </div>
    <button id="spinButton">Spin the Wheel</button>
    <div class="result" id="result"></div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinButton = document.getElementById('spinButton');
        const result = document.getElementById('result');
        let spins = 0;
        const maxSpins = 3;

        spinButton.addEventListener('click', () => {
            if (spins >= maxSpins) {
                result.textContent = "No spins left. Reload the page to try again.";
                return;
            }

            spins++;
            const segmentCount = 16;
            const randomDegree = Math.floor(Math.random() * 360 + 720 * spins); // Increase randomness with spins
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                const prizeIndex = Math.floor(((randomDegree % 360) / (360 / segmentCount)) + 0.5) % segmentCount;
                const prizes = [
                    '$50,000.00', '$100,000.00', '$125,000.00', '$150,000.00',
                    '$175,000.00', '$200,000.00', '$250,000.00', '$300,000.00',
                    '$450,000.00', '$500,000.00', '$600,000.00', '$800,000.00',
                    '$850,000.00', '$900,000.00', '$1,000,000.00', '$ Empty'
                ];
                const prize = prizes[prizeIndex];

                if (spins < maxSpins && prize === '$ Empty') {
                    result.textContent = `Try again! You have ${maxSpins - spins} spin(s) left.`;
                } else if (spins === maxSpins && prize === '$ Empty') {
                    result.textContent = 'Sorry, you didn\'t win this time. Better luck next time!';
                } else {
                    result.textContent = `🎉 Congratulations! You won ${prize}!`;
                    spinButton.disabled = true;
                }
            }, 5000); // Match the spin duration
        });
    </script>
</body>
</html>
