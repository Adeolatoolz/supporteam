<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Wheel Casino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #111, #333);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        #wheel {
        #wheel {
    background: conic-gradient(
        #FFD700 0% 6.25%, #FF4500 6.25% 12.5%, #32CD32 12.5% 18.75%, 
        #1E90FF 18.75% 25%, #FFD700 25% 31.25%, #FF4500 31.25% 37.5%, 
        #32CD32 37.5% 43.75%, #1E90FF 43.75% 50%, #FFD700 50% 56.25%, 
        #FF4500 56.25% 62.5%, #32CD32 62.5% 68.75%, #1E90FF 68.75% 75%, 
        #FFD700 75% 81.25%, #FF4500 81.25% 87.5%, #32CD32 87.5% 93.75%, 
        #1E90FF 93.75% 100%
    );
    border-radius: 50%;
    position: relative;
    transform: rotate(0deg);
    transition: transform 1.5s ease-out; /* Make it faster */
}
        #pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid white;
        }
        #roll-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #FFD700;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
        .loading {
            font-size: 18px;
            margin-top: 10px;
        }
        .loading span {
            animation: blink 1s infinite;
        }
        .loading span:nth-child(1) {
            animation-delay: 0s;
        }
        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="wheel-container">
        <div id="wheel"></div>
        <div id="pointer"></div>
    </div>
    <button id="roll-button">Tap to Roll</button>
    <div id="result"></div>
    <div class="loading" id="loading" style="display: none;">
        Loading<span>.</span><span>.</span><span>.</span>
    </div>
    <script src="wheel.js"></script>
</body>
</html>
