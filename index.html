<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lottery Website</h1>
    <div id="registration">
        <h2>Registration</h2>
        <form id="registrationForm">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <label for="picture">Upload Picture:</label>
            <input type="file" id="picture" name="picture" accept="image/*" required>
            <button type="submit">Register</button>
        </form>
    </div>
    <div id="gameSelection" style="display:none;">
        <h2>Select a Game</h2>
        <ul>
            <li><a href="jackpot.html">Jackpot</a></li>
            <li><a href="spinning.html">Spinning Board</a></li>
            <li><a href="ballscratch.html">Ball Scratch</a></li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
