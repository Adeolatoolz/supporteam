<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spin Wheel Casino</title>
    <style>
        /* CSS inline styling goes here */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #222, #000);
            color: white;
        }
        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#FFD700, #FF4500, #32CD32, #1E90FF, #FFD700, #FF4500);
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transform: perspective(1000px) rotateX(10deg);
        }
        #pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            width: 10px;
            height: 60px;
            background: white;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }
        #roll-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background: #FFD700;
            color: #000;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="wheel-container">
        <div id="wheel"></div>
        <div id="pointer"></div>
    </div>
    <button id="roll-button">Roll the Wheel</button>
    <div id="result"></div>
    <script src="wheel.js"></script>
</body>
</html>
