<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spin Wheel Casino</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #111, #444);
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
        }

        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            perspective: 1000px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ffd700 0deg 22.5deg, #ff4500 22.5deg 45deg,
                #ff6347 45deg 67.5deg, #32cd32 67.5deg 90deg,
                #00bfff 90deg 112.5deg, #ffa500 112.5deg 135deg,
                #8a2be2 135deg 157.5deg, #7fff00 157.5deg 180deg,
                #ff00ff 180deg 202.5deg, #4169e1 202.5deg 225deg,
                #ff4500 225deg 247.5deg, #ffd700 247.5deg 270deg,
                #800080 270deg 292.5deg, #dc143c 292.5deg 315deg,
                #00ff00 315deg 337.5deg, #0000ff 337.5deg 360deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            animation: spin 0.3s ease-out;
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #fff;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
        }

        #spin-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff4500;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2rem;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Spin & Win</h1>
    <div id="wheel-container">
        <div id="wheel">
            <div class="pointer"></div>
        </div>
    </div>
    <button id="spin-button">Spin</button>

    <script src="script.js"></script>
</body>
</html>
