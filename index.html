<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Casino Spin Wheel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #000000, #2c3e50);
            margin: 0;
            padding: 0;
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #FFD700 0% 6.25%, #FF6347 6.25% 12.5%, #90EE90 12.5% 18.75%, 
                #ADD8E6 18.75% 25%, #FFB6C1 25% 31.25%, #FFD700 31.25% 37.5%, 
                #FF6347 37.5% 43.75%, #FFD700 43.75% 50%, #FF6347 50% 56.25%, 
                #FFD700 56.25% 62.5%, #ADD8E6 62.5% 68.75%, #FFB6C1 68.75% 75%, 
                #FFD700 75% 81.25%, #FF6347 81.25% 87.5%, #FFD700 87.5% 93.75%, 
                #90EE90 93.75% 100%
            );
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.5);
            transform: rotate(0deg);
            transition: transform 3s cubic-bezier(0.5, 0, 0.25, 1);
        }

        #pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid red;
            z-index: 10;
        }

        #spinButton {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #spinButton:hover {
            background: #45a049;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="wheel-container">
        <div id="pointer"></div>
        <div id="wheel"></div>
    </div>
    <button id="spinButton">Tap to Spin</button>
    <p id="message"></p>
    <script>
        const wheel = document.getElementById('wheel');
const message = document.getElementById('message');
const spinButton = document.getElementById('spinButton');

const prizes = [
    '$50,000.00', '$100,000.00', '$125,000.00', '$150,000.00', 
    '$175,000.00', '$200,000.00', '$250,000.00', '$300,000.00',
    '$450,000.00', '$500,000.00', '$600,000.00', '$800,000.00',
    '$850,000.00', '$900,000.00', '$1,000,000.00', 'Empty'
];

let spinCount = 0; 
let baseAngle = 0;

spinButton.addEventListener('click', () => {
    spinCount++;
    let stopAngle = 0;
    let selectedPrize = '';

    if (spinCount < 3) {
        // First and second spins stop at "Empty"
        const emptyIndex = prizes.indexOf('Empty');
        stopAngle = baseAngle + (360 * 6) + (emptyIndex * 22.5); // 6 rotations plus the "Empty" angle
        selectedPrize = 'Empty';
        message.textContent = `Try Again! (${3 - spinCount} spin(s) left)`;
    } else {
        // Third spin stops at a random prize
        const randomIndex = Math.floor(Math.random() * prizes.length);
        stopAngle = baseAngle + (360 * 6) + (randomIndex * 22.5); // 6 rotations plus the prize angle
        selectedPrize = prizes[randomIndex];
        message.textContent = `Congratulations! You won ${selectedPrize}`;
        spinButton.disabled = true; // Disable further spins
    }

    // Spin the wheel
    wheel.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)';
    wheel.style.transform = `rotate(${stopAngle}deg)`;

    // Update baseAngle for the next spin
    baseAngle = stopAngle;
});
</body>
</html>
