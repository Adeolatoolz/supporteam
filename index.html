<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Casino Spin Wheel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #000000, #2c3e50);
            margin: 0;
            padding: 0;
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #FFD700 0% 6.25%, #FF6347 6.25% 12.5%, #90EE90 12.5% 18.75%, 
                #ADD8E6 18.75% 25%, #FFB6C1 25% 31.25%, #FFD700 31.25% 37.5%, 
                #FF6347 37.5% 43.75%, #FFD700 43.75% 50%, #FF6347 50% 56.25%, 
                #FFD700 56.25% 62.5%, #ADD8E6 62.5% 68.75%, #FFB6C1 68.75% 75%, 
                #FFD700 75% 81.25%, #FF6347 81.25% 87.5%, #FFD700 87.5% 93.75%, 
                #90EE90 93.75% 100%
            );
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.5);
            transform: rotate(0deg);
        }

        #pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid red;
            z-index: 10;
        }

        #spinButton {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #spinButton:hover {
            background: #45a049;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="wheel-container">
        <div id="pointer"></div>
        <div id="wheel"></div>
    </div>
    <button id="spinButton">Tap to Spin</button>
    <p id="message"></p>
    <script>
        const wheel = document.getElementById('wheel');
        const message = document.getElementById('message');
        const spinButton = document.getElementById('spinButton');

        const prizes = [
            '$50,000.00', '$100,000.00', '$125,000.00', '$150,000.00', 
            '$175,000.00', '$200,000.00', '$250,000.00', '$300,000.00',
            '$450,000.00', '$500,000.00', '$600,000.00', '$800,000.00',
            '$850,000.00', '$900,000.00', '$1,000,000.00', 'Empty'
        ];

        let spinCount = 0; 
        let isSpinning = false;

        spinButton.addEventListener('click', () => {
            if (isSpinning) return; // Prevent multiple spins at the same time
            isSpinning = true;
            spinCount++;

            let totalRotations = 360 * 5; // At least 5 full rotations for visual appeal
            let prizeIndex;

            if (spinCount < 3) {
                // Stop at "Empty" for the first two spins
                prizeIndex = prizes.indexOf('Empty');
                message.textContent = `Try Again! (${3 - spinCount} spin(s) left)`;
            } else {
                // Randomly select a prize for the third spin
                prizeIndex = Math.floor(Math.random() * prizes.length);
                message.textContent = `Congratulations! You won ${prizes[prizeIndex]}`;
                spinButton.disabled = true; // Disable further spins
            }

            // Calculate the exact angle to stop at the selected prize
            let prizeAngle = prizeIndex * (360 / prizes.length);
            let stopAngle = totalRotations + prizeAngle;

            // Animate the spin
            wheel.style.transition = 'transform 3s ease-out';
            wheel.style.transform = `rotate(${stopAngle}deg)`;

            // Reset spinning state after animation
            setTimeout(() => {
                isSpinning = false;
            }, 3000);
        });
    </script>
</body>
</html>
