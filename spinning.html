<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Spinning Board</h1>
    <div class="container" id="gameContainer">
        <h1>Welcome to the Spinning Board!</h1>
        <p>Tap the spinning board to test your luck!</p>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <div class="result" id="result"></div>
    </div>
    <div id="certificate" style="display:none;">
        <h2>Congratulations!</h2>
        <p id="certificateText"></p>
        <button id="downloadCertificate">Download Certificate</button>
        <p>Note: You need to pay $<span id="paymentAmount"></span> to stamp your certificate.</p>
        <button id="payBitcoin">Pay with Bitcoin</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
