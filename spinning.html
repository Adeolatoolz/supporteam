<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Spinning Board</h1>
    <div class="roulette">
        <div class="wheel spin">
            <div class="arrow"></div>
            <img src="https://i.imgur.com/N01W3Ks.png">
        </div>
    </div>
    <div class="result" id="result"></div>
    <div id="certificate" style="display:none;">
        <h2>Congratulations!</h2>
        <p id="certificateText"></p>
        <button id="downloadCertificate">Download Certificate</button>
        <p>Note: You need to pay $<span id="paymentAmount"></span> to stamp your certificate.</p>
        <button id="payBitcoin">Pay with Bitcoin</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
