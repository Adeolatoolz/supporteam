<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #111, #333);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .coin {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, #FFD700, #FFA500);
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5), -5px -5px 10px rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
        }
        .coin-container {
            display: flex;
            gap: 20px;
            margin: 20px;
        }
        #flip-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #FFD700;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            disabled: true;
        }
        .choice-buttons {
            margin-top: 20px;
        }
        .choice-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Coin Flip Game</h1>
    <div class="coin-container">
        <div id="player1-coin" class="coin">Heads</div>
        <div id="player2-coin" class="coin">Tails</div>
    </div>
    <div class="choice-buttons">
        <button id="choose-head">Choose Head</button>
        <button id="choose-tail">Choose Tail</button>
    </div>
    <button id="flip-button" disabled>Flip the Coin</button>
    <div id="result"></div>
    <script src="coin-flip.js"></script>
</body>
</html>
