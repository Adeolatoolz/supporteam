<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winner's Certificate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            color: #000;
            margin: 0;
            padding: 20px;
        }
        .certificate {
            border: 10px solid green;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5), -5px -5px 15px rgba(255, 255, 255, 0.5);
        }
        .logo {
            text-align: left;
            font-size: 24px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="logo">
            <img src="https://i.postimg.cc/MTxN8H1r/ailottery.png" alt="AI LOTTERY Logo" style="height: 50px;">
        </div>
        <h1>Congratulations, <span id="winnerName">Winner!</span>!</h1>
        <p>You have won <b><span id="winnerAmount">N/A</span></b>.</p>
        <p>To claim your prize, pay: <b><span id="winnerFee">N/A</span></b></p>
        <p>BTC Address: 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa</p>
    </div>

    <!-- Add this script at the end -->
    <script>
        // Populate the certificate with user details stored in localStorage
        document.getElementById("winnerName").textContent = localStorage.getItem("winnerName") || "Winner";
        document.getElementById("winnerAmount").textContent = localStorage.getItem("winnerAmount") || "N/A";
        document.getElementById("winnerFee").textContent = localStorage.getItem("winnerFee") || "N/A";
    </script>
</body>
</html>
