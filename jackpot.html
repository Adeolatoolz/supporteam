<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackpot Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Jackpot Game</h1>
    <div id="jackpotGame">
        <button id="playJackpot">Play Jackpot</button>
        <p id="jackpotResult"></p>
    </div>
    <div id="certificate" style="display:none;">
        <h2>Congratulations!</h2>
        <p id="certificateText"></p>
        <button id="downloadCertificate">Download Certificate</button>
        <p>Note: You need to pay $<span id="paymentAmount"></span> to stamp your certificate.</p>
        <button id="payBitcoin">Pay with Bitcoin</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
