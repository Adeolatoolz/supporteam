<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Lottery Game</h1>
    </header>

    <main>
        <section id="registration">
            <h2>Register to Play</h2>
            <form id="lotteryForm">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="text" id="gender" placeholder="Gender" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>
                <input type="text" id="address" placeholder="Home Address" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <button type="submit">Submit</button>
            </form>
        </section>

        <section id="lotteryGame" style="display: none;">
            <button id="scanLotteries">Scan Lotteries</button>
            <div id="lotteryNames" style="display: none;"></div>
            <div id="loadingLottery" style="display: none;">Loading your personal Lottery game <span id="loadingPercentage">1%</span></div>
            <button id="goForIt" style="display: none;">GO FOR IT</button>
        </section>

        <section id="spinningWheelGame" style="display: none;">
            <div id="wheelContainer">
                <canvas id="wheelCanvas"></canvas>
                <button id="spinWheel">Spin the Wheel</button>
            </div>
            <div id="resultMessage"></div>
        </section>

        <section id="uploadSection" style="display: none;">
            <h2>Upload Your Picture</h2>
            <input type="file" id="uploadFile">
            <button id="uploadButton">Upload</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Lottery Game</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
